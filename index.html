<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品购买页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            max-width: 480px;
            margin: 0 auto;
            padding: 10px;
            background: #fff;
        }
        .product-img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .buy-btn {
            width: 100%;
            padding: 14px;
            background: #ff3333;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .loading-mask {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            color: #fff;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }
        .loading-spin {
            width: 28px;
            height: 28px;
            border: 3px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <img src="https://raw.githubusercontent.com/PuTongDeRenLei/test/refs/heads/main/21.png" class="product-img" alt="商品图片">
    <button class="buy-btn" onclick="showLoading()">立即购买</button>

    <div class="loading-mask" id="loading">
        <div class="loading-spin"></div>
        <span>加载中...</span>
    </div>

    <script>
        function showLoading() {
            document.getElementById('loading').style.display = 'flex';
        }
    </script>
</body>
</html>
