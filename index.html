<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>看到这段文本的是gay👿</title>
	<style>
		button {
			position: relative;
			width: 180px;
			height: 90px;
			background-color: #00a9ff;
			border-radius: 10px;
			cursor: pointer;
			border: none;
			font-size: 35px;
			transition: transform 0.17s ease-in-out;
		}
		.button:hover {
            background-color: #33b5ff;
            transform: scale(1.05);
        }

    	.button:active {
            background-color: #0088cc;
            transform: scale(1.01);
       	}
        #myImage {
			display: none;
			width: 500px;
			height: 286px;
		}
	</style>
</head>
<body>
	<h1 align="center">点进这个网页的这辈子有了😋</h1>
	<button class="button" onclick="showImage()">别点我😱</button>
	<img id="myImage" src="21.png">
	
	<script>
		function showImage() {
			document.querySelector('.button').style.display = 'none';
			document.getElementById('myImage').style.display = 'block';
		}
	</script>
</body>
</html>
